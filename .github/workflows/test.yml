name: tests

# Locks in the contracts the repo's design hinges on:
#   - Default install is hermetic — pure Python core works with no optional deps.
#   - The optional [cypher] extra (LadybugDB) installs cleanly and the equivalence
#     tests (LadybugDB vs pure-Python matcher) pass on a fresh runner.
# A two-job matrix is the minimum that proves both: dropping the base job would
# let a stray `import ladybug` outside the optional-extra gate go unnoticed; dropping
# the cypher job would let the LadybugDB wheel rot until a user hits it.

on:
  push:
  pull_request:

# Read-only by default — pytest doesn't need write access to anything in the repo,
# and tightening here makes a compromised dependency strictly less dangerous.
permissions:
  contents: read

jobs:
  phoenix-cli-contract:
    name: Phoenix CLI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Load Phoenix runtime pins
        run: echo "PX_VERSION=$(jq -r .phoenix_cli contracts/phoenix-runtime.json)" >> "$GITHUB_ENV"

      # Phoenix is an external runtime CLI rather than a Python dependency. Pin the
      # exact package used to verify the read-only flags tracegraph relies on; the
      # runtime floor remains 1.0.4, when trace annotation export became available.
      - name: Verify px read contract
        run: |
          set -euo pipefail
          test "$(npx --yes @arizeai/phoenix-cli@$PX_VERSION --version)" = "$PX_VERSION"
          npx --yes @arizeai/phoenix-cli@$PX_VERSION trace get --help | grep -F -- '--include-annotations'
          npx --yes @arizeai/phoenix-cli@$PX_VERSION trace get --help | grep -F -- '--project'
          npx --yes @arizeai/phoenix-cli@$PX_VERSION trace list --help | grep -F -- '--include-annotations'
          npx --yes @arizeai/phoenix-cli@$PX_VERSION trace list --help | grep -F -- '--project'
          npx --yes @arizeai/phoenix-cli@$PX_VERSION project list --help | grep -F -- '--format'

      - name: Verify px trace-list output schema
        run: >-
          python3 scripts/verify_phoenix_cli_contract.py
          npx --yes @arizeai/phoenix-cli@$PX_VERSION

  base:
    name: pure-python core
    runs-on: ubuntu-latest
    steps:
      # First-party actions (actions/*) stay tag-pinned: a tag rotation would
      # require a GitHub-owned org compromise. Third-party actions below are
      # SHA-pinned because their tag-mutation surface is unilateral.
      - uses: actions/checkout@v4

      # Pinned to the v4.2.0 commit SHA (not the mutable `v4` tag) so a hijacked
      # tag can't silently swap the action body under us. Bump deliberately.
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # `--locked` rejects any drift from uv.lock: CI should fail the PR that
      # forgot to commit a regenerated lockfile, not silently resolve a new one
      # and pass against it.
      - name: Install (no optional extras)
        run: uv sync --locked

      # The whole point of this job is to assert the optional-extra gate works.
      # `pytest.importorskip("ladybug")` skips the cypher tests transparently, so a
      # transitive dep that quietly pulled ladybug into the default install would
      # turn that skip into a run and the gate would silently break. Catch it
      # here, before pytest, with a one-liner that fails loud.
      - name: Assert ladybug is NOT installed in the default environment
        run: |
          uv run --no-sync python -c "import importlib.util, sys; \
            spec = importlib.util.find_spec('ladybug'); \
            sys.exit(0) if spec is None else sys.exit(f'ladybug leaked into the default install at {spec.origin!r}')"

      # `--no-sync` so pytest runs against exactly what `uv sync --locked` put
      # in the venv (no re-resolve possible mid-job).
      - name: pytest
        run: uv run --no-sync pytest -v

  cypher:
    name: with [cypher] extra (LadybugDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install with cypher extra
        run: uv sync --locked --extra cypher

      - name: pytest (cypher tests included)
        run: uv run --no-sync --extra cypher pytest -v
