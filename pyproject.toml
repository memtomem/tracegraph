[project]
name = "tracegraph"
version = "0.1.0"
description = "Time-travel debugging and causal RCA for LangGraph agent traces, on a causal graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "langgraph-checkpoint-sqlite>=2",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
tracegraph = "tracegraph.cli:main"

# Optional accelerator backend — NOT needed for the pure-Python core (Phase 0–3).
# Pinned because kuzu's repo was archived Oct 2025 and its on-disk format was never stabilized.
[project.optional-dependencies]
cypher = ["kuzu==0.11.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "langgraph>=0.2",
    "jsonschema>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
markers = [
    "cypher: tests that require the optional [cypher] (Kùzu) backend",
]
