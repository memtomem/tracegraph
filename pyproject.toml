[project]
name = "tracegraph"
version = "0.1.0"
description = "Time-travel debugging and causal RCA for LangGraph agent traces, on a causal graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "langgraph-checkpoint-sqlite>=2",
    "typer>=0.12",
    "rich>=13",
    # Recomputes a LangGraph task id to name the node behind a native failure. LangGraph
    # hashes those ids with xxh3-128 and depends on xxhash itself, but langgraph is a *dev*
    # dependency here (this package reads checkpoints, it does not run graphs), and
    # langgraph-checkpoint pulls in only ormsgpack — so the dependency is ours to declare.
    "xxhash>=3",
]

[project.scripts]
tracegraph = "tracegraph.cli:main"

# Optional accelerator backend — NOT needed for the pure-Python core (Phase 0–3).
# LadybugDB is the actively maintained successor to the archived Kùzu project. The JSON
# artifact remains authoritative, so an accelerator cache is rebuilt across DB versions.
[project.optional-dependencies]
cypher = ["ladybug>=0.18,<0.19"]

[dependency-groups]
dev = [
    "pytest>=8",
    "langgraph>=0.2",
    "jsonschema>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracegraph"]

# The package is fully annotated; without this marker PEP 561 tells type checkers to ignore
# the installed distribution, so downstream consumers get no types at all.
[tool.hatch.build.targets.wheel.force-include]
"src/tracegraph/py.typed" = "tracegraph/py.typed"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Deliberately narrow: this codebase carries long explanatory comments and intentionally
# dense expressions, so the goal is catching real defects (undefined names, unused imports,
# shadowed builtins), not enforcing a house style after the fact.
select = ["F", "E4", "E7", "E9", "B"]
ignore = ["B008"]  # typer declares option defaults in the signature by design

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
markers = [
    "cypher: tests that require the optional [cypher] (LadybugDB) backend",
    "perf: wall-clock regression guards; deselect with -m 'not perf' on loaded machines",
]
